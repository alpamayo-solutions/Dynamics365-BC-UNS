name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION="${TAG#v}"
          # Append .0 for BC version format (X.Y.Z -> X.Y.Z.0)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update app.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update version in app.json using jq
          jq --arg v "$VERSION" '.version = $v' app/app.json > app/app.json.tmp
          mv app/app.json.tmp app/app.json
          jq --arg v "$VERSION" '.version = $v | (.dependencies[] | select(.name == "UNS Bridge Connector") | .version) = $v' test/app.json > test/app.json.tmp
          mv test/app.json.tmp test/app.json
          echo "Updated app.json to version $VERSION"
          grep version app/app.json

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.json test/app.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin main

  build:
    needs: update-version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read app.json
        id: app-info
        shell: pwsh
        run: |
          $appJson = Get-Content -Path "app/app.json" -Raw | ConvertFrom-Json
          echo "version=$($appJson.version)" >> $env:GITHUB_OUTPUT

      - name: Start Docker
        shell: pwsh
        run: |
          # windows-latest (windows-2025-vs2026 since 2026-10) has Docker installed but not running.
          $docker = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $docker) { throw "Docker is not installed on this runner image" }
          if ($docker.Status -ne 'Running') { Start-Service docker }
          docker version

      - name: Install BcContainerHelper
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name BcContainerHelper -Force -AllowClobber

      - name: Download previous release (upgrade test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v1.5.2 -R ${{ github.repository }} -p "*.zip" -D previous

      - name: Build, upgrade and test in BC container
        shell: pwsh
        run: |
          $previous = (Get-ChildItem previous\*.zip | Select-Object -First 1).FullName
          ./scripts/Test-InBcContainer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PreviousApp $previous

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: out/TestResults.xml
          fail_on_failure: true
          include_passed: true
          check_name: AL Tests

      - name: Create zip and upload to release
        if: success()
        shell: pwsh
        run: |
          $appFile = Get-ChildItem -Path "out/*.app" | Select-Object -First 1
          $zipName = $appFile.BaseName + ".zip"
          Compress-Archive -Path $appFile.FullName -DestinationPath $zipName
          gh release upload ${{ github.event.release.tag_name }} $zipName --clobber -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: al-app-${{ steps.app-info.outputs.version }}
          path: out/*.app
          if-no-files-found: error
