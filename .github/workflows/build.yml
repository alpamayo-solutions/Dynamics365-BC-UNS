name: Build AL App

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-al-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app.json
        id: app-info
        shell: pwsh
        run: |
          $appJson = Get-Content -Path "app/app.json" -Raw | ConvertFrom-Json
          echo "version=$($appJson.version)" >> $env:GITHUB_OUTPUT

      - name: Install BcContainerHelper
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name BcContainerHelper -Force -AllowClobber

      - name: Download previous release (upgrade test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v1.5.2 -R ${{ github.repository }} -p "*.zip" -D previous

      - name: Build, upgrade and test in BC container
        shell: pwsh
        run: |
          $previous = (Get-ChildItem previous\*.zip | Select-Object -First 1).FullName
          ./scripts/Test-InBcContainer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -PreviousApp $previous

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: out/TestResults.xml
          fail_on_failure: true
          include_passed: true
          check_name: AL Tests

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: al-app-${{ steps.app-info.outputs.version }}
          path: out/*.app
          if-no-files-found: error
